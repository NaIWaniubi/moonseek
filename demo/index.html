<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moonseek — 纯 MoonBit 全文搜索引擎</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  .container { width: 100%; max-width: 760px; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  h1 .moon { color: var(--accent); }
  .subtitle { color: var(--dim); font-size: 14px; margin-bottom: 24px; }
  .badge { display: inline-block; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--green); margin-left: 8px; }
  .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="text"] { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 16px; outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  button { background: var(--accent); border: none; border-radius: 8px; padding: 12px 24px; color: #fff; font-size: 16px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .examples { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .examples a { color: var(--accent); cursor: pointer; text-decoration: none; margin-right: 12px; }
  .stats { color: var(--dim); font-size: 13px; margin-bottom: 16px; font-family: monospace; }
  .result { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .result .title { font-size: 16px; color: var(--accent); margin-bottom: 4px; }
  .result .score { float: right; color: var(--dim); font-size: 12px; font-family: monospace; }
  .result .body { color: var(--dim); font-size: 14px; line-height: 1.5; }
  .result mark { background: rgba(88,166,255,0.25); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .empty { color: var(--dim); text-align: center; padding: 40px; }
  .error { color: #f85149; padding: 12px; }
  footer { margin-top: 32px; color: var(--dim); font-size: 12px; text-align: center; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1><span class="moon">☾</span> moonseek <span class="badge" id="status">loading…</span></h1>
  <p class="subtitle">纯 MoonBit 实现的嵌入式全文搜索引擎 · 倒排索引 + BM25 + 中文二元切分 · 你的浏览器里运行着一个 WASM 搜索引擎</p>
  <div class="search-box">
    <input type="text" id="query" placeholder="输入查询：搜索引擎 / 学而时习之 / memory safety / title:rust …" autofocus>
    <button id="search-btn">搜索</button>
  </div>
  <div class="examples">
    试试：
    <a data-q="搜索引擎">搜索引擎</a>
    <a data-q="学而时习之">学而时习之</a>
    <a data-q="上善若水">上善若水</a>
    <a data-q="memory safety">memory safety</a>
    <a data-q="title:rust">title:rust</a>
    <a data-q="wasm*">wasm*</a>
  </div>
  <div class="stats" id="stats"></div>
  <div id="results"><div class="empty">正在加载 WASM 引擎…</div></div>
  <footer>
    索引与查询全部在本地浏览器内完成，无网络请求 ·
    <a href="https://github.com/cs6210501-lab/moonseek">GitHub</a> ·
    Apache-2.0
  </footer>
</div>
<script type="module">
import { CORPUS } from "./corpus.js";

const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");
const resultsEl = document.getElementById("results");
const queryEl = document.getElementById("query");

let api = null;
const corpusById = new Map(CORPUS.map(([id, title, body]) => [id, { title, body }]));

async function boot() {
  const { instance } = await WebAssembly.instantiateStreaming(
    fetch("./web.wasm"),
    {},
    { builtins: ["js-string"], importedStringConstants: "_" }
  );
  api = instance.exports;
  api.ms_init();
  const t0 = performance.now();
  for (const [id, title, body] of CORPUS) {
    const err = api.ms_add(id, title, body);
    if (err) throw new Error(err);
  }
  const indexMs = (performance.now() - t0).toFixed(1);
  statusEl.textContent = "WASM ready";
  statsEl.textContent = `${api.ms_count()} documents · ${api.ms_terms()} terms · indexed in ${indexMs} ms`;
  resultsEl.innerHTML = '<div class="empty">输入查询开始搜索</div>';
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(text, query) {
  let html = escapeHtml(text);
  // Highlight each query term (strip operators/field prefixes for display).
  const terms = query.replace(/["()]/g, "").split(/\s+/)
    .filter(t => t && !["AND", "OR", "NOT"].includes(t))
    .map(t => t.replace(/^\w+:/, "").replace(/\*$/, ""))
    .filter(t => t.length > 0);
  for (const term of terms) {
    const escaped = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    html = html.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
  }
  return html;
}

function search() {
  if (!api) return;
  const query = queryEl.value.trim();
  if (!query) { resultsEl.innerHTML = '<div class="empty">输入查询开始搜索</div>'; return; }
  const t0 = performance.now();
  const raw = api.ms_search(query, 10);
  const elapsed = (performance.now() - t0).toFixed(2);
  const parsed = JSON.parse(raw);
  if (parsed.error) {
    resultsEl.innerHTML = `<div class="error">查询错误：${escapeHtml(parsed.error)}</div>`;
    return;
  }
  if (parsed.length === 0) {
    resultsEl.innerHTML = `<div class="empty">无结果（${elapsed} ms）</div>`;
    return;
  }
  resultsEl.innerHTML = parsed.map(hit => {
    const doc = corpusById.get(hit.id) || { title: hit.id, body: "" };
    return `<div class="result">
      <span class="score">${hit.score.toFixed(4)}</span>
      <div class="title">${highlight(doc.title, query)}</div>
      <div class="body">${highlight(doc.body, query)}</div>
    </div>`;
  }).join("") + `<div class="stats">${parsed.length} hits in ${elapsed} ms</div>`;
}

document.getElementById("search-btn").addEventListener("click", search);
queryEl.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
document.querySelectorAll(".examples a").forEach(a => {
  a.addEventListener("click", () => { queryEl.value = a.dataset.q; search(); });
});

boot().catch(e => {
  statusEl.textContent = "load failed";
  resultsEl.innerHTML = `<div class="error">WASM 加载失败：${escapeHtml(e.message)}<br>请用支持 WasmGC + js-string-builtins 的浏览器（Chrome / Edge 最新版）。</div>`;
});
</script>
</body>
</html>
