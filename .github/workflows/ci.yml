name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [wasm-gc, js, native]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain info
        run: |
          moon version --all
          moon update

      # moon fmt normalizes code; commit the result so the tree is always
      # canonical for the latest toolchain (formatting rules evolve).
      - name: Format
        run: moon fmt

      - name: Check
        run: moon check --target ${{ matrix.target }}

      - name: Test (debug)
        run: moon test --target ${{ matrix.target }}

      - name: Test (release)
        run: moon test --target ${{ matrix.target }} --release

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Benchmarks
        run: |
          moon update
          moon bench --target native --release

  # The registry corpus and the quality report are generated artifacts. This
  # job regenerates both from source and fails if the committed report or
  # snapshot is stale, so the published numbers cannot silently rot.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Rebuild the corpus and the quality report
        run: |
          moon update
          moon run tools/registry --target native --release -- demo/registry.json /tmp/registry.msk
          moon run tools/eval --target native --release -- demo/registry.json /tmp/quality.md --json /tmp/quality.json
      - name: Committed report must match the measurement
        run: python3 tools/check-quality-docs.py docs/quality.md /tmp/quality.md
      - name: Native snapshot must load in the wasm build
        run: |
          # Cross-target check: a snapshot written by native must be readable by
          # the wasm build, which is the claim the browser demo rests on.
          moon build --target wasm-gc --release
          node tools/smoke-wasm-snapshot.mjs _build/wasm-gc/release/build/web/web.wasm /tmp/registry.msk

  # The cluster's two claims are end-to-end behaviours, not unit-testable
  # properties: run real shards, index a real corpus, and check that two-phase
  # scoring reproduces a single node and that a killed shard is reported.
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Build the server
        run: |
          moon update
          moon build server --target native --release
      - name: Cluster end-to-end
        run: |
          bash tools/test-cluster.sh _build/native/release/build/server/server.exe .

  # The replication claim is a different one from the cluster claim: it says a
  # write routed through the coordinator reaches every member of the owning
  # group, so failover survives data that was written after the replica started.
  # It needs a second binary per shard, so it gets its own job.
  replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Build the server
        run: |
          moon update
          moon build server --target native --release
      - name: Write replication and failover
        run: |
          bash tools/test-replication.sh _build/native/release/build/server/server.exe .

  # Whether the cluster can *grow* is a different claim from whether it can
  # tolerate a failure: it says a prediction made by the planner matches what the
  # executor moves, and that the corpus survives the move exactly once.
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Build the server
        run: |
          moon update
          moon build server --target native --release
      - name: Grow a cluster from 3 shards to 4 without reindexing
        run: |
          bash tools/test-rebalance.sh _build/native/release/build/server/server.exe .

  # A member that was down while the cluster took writes is brought back in line
  # with its group's primary, in both directions.
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Build the server
        run: |
          moon update
          moon build server --target native --release
      - name: Repair a member that missed writes
        run: |
          bash tools/test-repair.sh _build/native/release/build/server/server.exe .
